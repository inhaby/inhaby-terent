<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Inhaby | Find Verified Rental Homes, Flats & PGs Near You
  </title>

  <meta
    name="description"
    content="Find verified rental homes, PGs, apartments, flats, villas and rooms near you. Browse owner-listed properties with zero brokerage, verified listings and secure booking across India."
  />

  <meta
    name="keywords"
    content="
    homes near me,
    rental homes
    house on rent
    rental homes near me,
    apartments near me,
    flats near me,
    PG near me,
    rooms for rent,
    house for rent,
    rental property,
    owner listed homes,
    verified rentals,
    no brokerage homes,
    apartments for rent,
    property near me,
    home booking,
    rental accommodation,
    student housing,
    co-living,
    family homes,
    furnished apartments,
    rental marketplace India
    "
  />

  <meta
    name="author"
    content="Inhaby"
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />

  <meta
    name="theme-color"
    content="#6D7F5E"
  />

  <link
    rel="canonical"
    href="https://inhaby.com/"
  />

  <!-- Open Graph -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://inhaby.com/"
  />

  <meta
    property="og:title"
    content="Inhaby | Verified Rental Homes Near You"
  />

  <meta
    property="og:description"
    content="Find verified homes, apartments, villas, PGs and rental properties with zero brokerage."
  />

  <meta
    property="og:image"
    content="https://inhaby.com/og-image.jpg"
  />

  <!-- Twitter -->

  <meta
    property="twitter:card"
    content="summary_large_image"
  />

  <meta
    property="twitter:title"
    content="Inhaby | Rental Homes Near You"
  />

  <meta
    property="twitter:description"
    content="Verified homes, flats, PGs and apartments across India."
  />

  <meta
    property="twitter:image"
    content="https://inhaby.com/og-image.jpg"
  />

  <!-- Favicon -->

  <link
    rel="icon"
    href="/favicon.ico"
  />

  <!-- Structured Data -->

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebSite",
    "name":"Inhaby",
    "url":"https://inhaby.com",
    "potentialAction":{
      "@type":"SearchAction",
      "target":"https://inhaby.com/search?q={search_term_string}",
      "query-input":"required name=search_term_string"
    }
  }
  </script>

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.tsx"
  ></script>

</body>

</html>
